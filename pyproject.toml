requires-python = ">=3.11"
dependencies = [
    "h5py>=3.11",
    "numpy>=2.0",
    "marimo>=0.25.1",
    "plotly>=6.0",
    "anywidget>=0.11.0",
]

[dependency-groups]
dev = ["playwright>=1.50"]

