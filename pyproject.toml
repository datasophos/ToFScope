[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tofscope"
version = "0.2.0"
description = "Multi-analysis ToF-SIMS exploration and calibrated 3D visualization"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
    "h5py>=3.11",
    "numpy>=2.0,<2.4; sys_platform == 'win32'",
    "numpy>=2.0; sys_platform != 'win32'",
    "filelock>=3.16",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6",
]

[project.scripts]
tofscope = "tofscope.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "build>=1.2",
    "playwright>=1.50",
    "rosettasciio==0.15.0",
]
docs = [
    "great-docs==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tofscope = ["static/**/*", "static/*", "resources/reference/*"]
