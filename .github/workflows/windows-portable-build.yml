name: Windows portable build

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, tomllib; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['RELEASE_TAG'] == f'v{v}', 'Release tag must match the package version'"
      - run: uv sync --frozen
      - name: Install packaging tool
        run: uv pip install --python .venv/Scripts/python.exe pyinstaller==6.17.0
      - run: uv run --no-sync python -m unittest discover -s tests -p test_windows_launcher.py -v
      - name: Build standalone application folder
        run: >-
          uv run --no-sync python -m PyInstaller --noconfirm --clean
          scripts/windows/tofscope.spec
      - name: Check packaged application
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/ToFScope/ToFScope-cli.exe).Path
          & $exe doctor --data-root $env:RUNNER_TEMP --runtime-dir "$env:RUNNER_TEMP/tofscope-test-runtime"
          if ($LASTEXITCODE -ne 0) { throw "Packaged doctor failed" }
          $process = Start-Process -FilePath $exe -ArgumentList @('serve', '--data-root', "`"$env:RUNNER_TEMP`"", '--runtime-dir', "`"$env:RUNNER_TEMP/tofscope-test-runtime`"", '--port', '18765') -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($process.HasExited) { throw "Packaged service exited early: $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/readyz' -TimeoutSec 1 -UseBasicParsing
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Packaged service did not become ready' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Check launcher control of frozen service
        run: uv run --no-sync python scripts/windows/check_bundle.py dist/ToFScope/ToFScope.exe
      - name: Package portable ZIP
        id: package
        shell: pwsh
        run: |
          $version = uv run --no-sync python -c "from tofscope import __version__; print(__version__)"
          $archive = "ToFScope-$version-windows-x64.zip"
          Copy-Item scripts/windows/README.txt dist/ToFScope/README.txt
          Compress-Archive -Path dist/ToFScope/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ToFScope-windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ToFScope-windows-x64
          path: release-assets
      - name: Attach portable build to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*
