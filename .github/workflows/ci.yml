name: Packaged Explore
on: [push, pull_request]
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend exec -- playwright install --with-deps chrome
      - run: npm --prefix frontend run generate:api
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/generated.ts
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run test:e2e
      - run: uv run python scripts/build_frontend.py
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build
      - run: uv run python scripts/check_distribution.py --artifacts dist --output /tmp/tofscope-distribution
      - run: uv run python scripts/check_container.py
      - run: git diff --check
