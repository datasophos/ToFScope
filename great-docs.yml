module: tofscope
display_name: ToFScope
repo: https://github.com/datasophos/ToFScope
site_url: https://datasophos.github.io/ToFScope/
sections:
  - title: Getting started
    dir: docs/getting-started
  - title: Using ToFScope
    dir: docs/using-tofscope
  - title: Technical documentation
    dir: docs/technical-documentation
pre_render:
  - scripts/prepare_docs.py

# ToFScope is an application; its internal Python modules are not a public API.
reference: false
cli:
  enabled: false
mcp:
  enabled: false
skill:
  enabled: false
changelog:
  enabled: false

logo: docs/assets/tofscope-navbar.svg
favicon: docs/assets/favicon.png
# Great Docs emits absolute favicon URLs, which point previews at the published site.
include_in_header:
  # Apply Great Docs’ sticky-sidebar fix with a solid navbar color.
  - file: navbar-style-include.html
  - text: |
      <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Great Docs adds a version tooltip to the navbar logo after rendering.
        document.querySelector(".navbar-brand-logo")?.removeAttribute("data-tippy-content");
        const offset = document.querySelector('meta[name="quarto:offset"]')?.content || "";
        document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach((link) => {
          const name = new URL(link.href).pathname.split("/").pop();
          if (["favicon.ico", "favicon-16x16.png", "favicon-32x32.png", "apple-touch-icon.png"].includes(name)) {
            link.href = offset + name;
          }
        });
      });
      </script>
hero:
  enabled: true
  logo:
    light: docs/assets/tofscope-hero-light.svg
    dark: docs/assets/tofscope-hero-dark.svg
    alt: "ToFScope — FIB–SEM / TOF–SIMS"
  logo_height: 110px
  name: false
  tagline: Explore, visualize, and analyze FIB ToF-SIMS data.
  badges: true
accent_color: "#147d80"
navbar_color: "#102536"
github_style: icon
dark_mode_toggle: true
source:
  branch: main
announcement:
  content: "Heads up! ToFScope is still in alpha status. Features and file compatibility may change."
  type: info
  dismissable: true
site:
  css: docs/styles.css
  toc: true
  toc-depth: 2
